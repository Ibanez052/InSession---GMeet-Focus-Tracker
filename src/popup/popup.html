<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InSession</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

  <div class="app-window">
    <!-- Top Bar -->
    <header>
      <div class="brand-container">
        <img src="../../assets/logo.png" alt="InSession Logo" style="height: 80px; width: auto;" />
      </div>
      <a href="#logout" class="logout-btn">Logout</a>
    </header>

    <!-- Main Body Area -->
    <main>
      <!-- Stats Counters -->
      <section class="stats-grid">
        <div class="stat-card card-yellow">
          <div class="stat-title">Attendees</div>
          <div class="stat-number">55</div>
        </div>
        <div class="stat-card card-green">
          <div class="stat-title">Active</div>
          <div class="stat-number">49/55</div>
        </div>
        <div class="stat-card card-red">
          <div class="stat-title">Away</div>
          <div class="stat-number">6/56</div>
        </div>
      </section>

      <!-- Gray Controls & Records Wrapper -->
      <section class="panel-container">
        <!-- Actions & Filter Tools -->
        <div class="toolbar">
          <div class="action-buttons">
            <button type="button" class="btn btn-start">Start</button>
            <button type="button" class="btn btn-pause">Pause</button>
            <button type="button" class="btn btn-end">End</button>
          </div>

          <div class="filter-tools">
            <div class="search-wrapper">
              <!-- Magnifying Glass Icon -->
              <img src="../../assets/search-icon.png" alt="Search Icon" class="search-icon"/>
              <input type="text" class="search-input" placeholder="Search participant" />
            </div>

            <!-- Filter Dropdown Container -->
             <div class="dropdown-wrapper">
                <button type="button" class="filter-btn" id="filter-btn">
                <!-- Filter / Funnel Icon -->
                <img src="../../assets/bars-filter.png" alt="Filter Icon" class="filter-icon"/>
                <span id="currentFilterText">Show all</span>
                <span class="dropdown-arrow">V</span>
              </button>
              <ul class="dropdown-menu" id="filterDropdown">
                <li data-value="all" class="active">Show all</li>
                <li data-value="active">Active</li>
                <li data-value="away">Inactive</li>
              </ul>
             </div>
            
          </div>
        </div>

        <!-- Participants Table -->
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-student">Student</th>
                <th class="col-status">Status</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr>
                <td colspan="2" style="text-align: center; padding: 24px; color: #888;">
                  Connecting to live database...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
