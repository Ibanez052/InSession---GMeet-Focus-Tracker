<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InSession</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

  <div class="app-window">
    <!-- Top Bar -->
    <header>
      <div class="brand-container">
        <span class="brand-name">InSession</span>
      </div>
      <div class="auth-controls">
        <span id="account-status" role="status">Sign in to manage a session</span>
        <button type="button" id="sign-in" class="logout-btn">Sign in with Google</button>
        <button type="button" id="sign-out" class="logout-btn" hidden>Sign out</button>
      </div>
    </header>

    <!-- Main Body Area -->
    <main>
      <!-- Stats Counters -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Attendees</div>
          <div class="stat-number" id="attendee-count">–</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Active</div>
          <div class="stat-number" id="active-count">–</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Away</div>
          <div class="stat-number" id="away-count">–</div>
        </div>
      </section>

      <!-- Gray Controls & Records Wrapper -->
      <section class="panel-container">
        <!-- Actions & Filter Tools -->
        <div class="toolbar">
          <div class="action-buttons" id="host-controls" hidden>
            <button type="button" class="btn btn-start">Start</button>
            <button type="button" class="btn btn-pause">Pause</button>
            <button type="button" class="btn btn-end">End</button>
          </div>
          <p id="session-notice" role="status" hidden></p>

          <div class="filter-tools">
            <div class="search-wrapper">
              <!-- Magnifying Glass Icon -->
              <img src="../../assets/search-icon.png" alt="" aria-hidden="true" class="search-icon" />
              <input type="search" class="search-input" aria-label="Search participants by name" placeholder="Search participant" />
            </div>

            <!-- Filter Dropdown Container -->
            <label class="sr-only" for="status-filter">Filter participants by status</label>
            <div class="filter-select-wrap">
              <img src="../../assets/bars-filter.png" alt="" aria-hidden="true" class="filter-icon" />
              <select class="filter-select" id="status-filter">
                <option value="all">Show all</option>
                <option value="active">Active</option>
                <option value="away">Away</option>
                <option value="left">Left</option>
              </select>
            </div>
            
          </div>
        </div>

        <!-- Participants Table -->
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-student" scope="col">Student</th>
                <th class="col-status" scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr>
                <td colspan="2" style="text-align: center; padding: 24px; color: #888;">
                  Connecting to live database...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
